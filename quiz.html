<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华服雅韵 - 答题环节</title>
    <link rel="stylesheet" href="static/css/traditional.css">
    <style>
        .gesture-status {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(218, 165, 32, 0.2);
        }
        .gesture-status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .gesture-status-label {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            letter-spacing: 0.1em;
        }
        .gesture-status-value {
            font-size: 1rem;
            font-weight: bold;
            padding: 0.25rem 1rem;
            border-radius: 6px;
            min-width: 80px;
            text-align: center;
            transition: all 0.2s ease;
        }
        .gesture-status-value.unknown {
            background: rgba(128, 128, 128, 0.2);
            color: var(--color-text-muted);
            border: 1px solid rgba(128, 128, 128, 0.3);
        }
        .gesture-status-value.correct {
            background: rgba(46, 139, 87, 0.3);
            color: #2ecc71;
            border: 1px solid rgba(46, 139, 87, 0.5);
        }
        .gesture-status-value.wrong {
            background: rgba(192, 57, 43, 0.3);
            color: #e74c3c;
            border: 1px solid rgba(192, 57, 43, 0.5);
        }
        .gesture-status-value.active {
            background: rgba(218, 165, 32, 0.3);
            color: var(--china-gold);
            border: 1px solid rgba(218, 165, 32, 0.5);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .option-item {
            display: flex;
            align-items: center;
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(218, 165, 32, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            color: var(--color-text-muted);
        }
        .option-item:hover {
            border-color: rgba(218, 165, 32, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }
        .option-item.selected {
            border-color: var(--china-gold);
            background: rgba(218, 165, 32, 0.15);
            color: var(--china-gold);
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(218, 165, 32, 0.2);
        }
        .option-item.correct {
            border-color: #2ecc71;
            background: rgba(46, 139, 87, 0.2);
            color: #2ecc71;
        }
        .option-item.wrong {
            border-color: #e74c3c;
            background: rgba(192, 57, 43, 0.2);
            color: #e74c3c;
        }
        .option-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(218, 165, 32, 0.2);
            color: var(--china-gold);
            font-weight: bold;
            margin-right: 1rem;
            flex-shrink: 0;
        }
        .option-item.selected .option-letter {
            background: var(--china-gold);
            color: var(--ink);
        }

        .gesture-hint {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }
        .hint-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--color-text-muted);
        }
        .hint-icon {
            font-size: 1.5rem;
        }
        .hint-item.active {
            color: var(--china-gold);
        }

        .confirm-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--china-gold);
            border-radius: 50%;
            width: 120px;
            height: 120px;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
        }
        .confirm-indicator.visible {
            display: flex;
            animation: confirmPulse 0.5s ease-out;
        }
        @keyframes confirmPulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .confirm-indicator-text {
            color: var(--china-gold);
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        .confirm-indicator-icon {
            font-size: 2.5rem;
        }
    </style>
</head>
<body>
    <div id="quiz-page" class="page-container">
        <div class="page-ui">
            <div class="quiz-container" id="quiz-container">
                <div class="quiz-progress" id="quiz-progress"></div>

                <div id="question-area">
                    <h2 id="question-text" class="quiz-question">题目加载中...</h2>
                </div>

                <div class="options-container" id="options-container">
                </div>

                <div id="feedback-area" style="margin-top: 2rem; min-height: 60px;">
                    <div id="feedback-indicator" class="gesture-indicator"></div>
                </div>

                <div class="gesture-hint">
                    <div class="hint-item" id="hint-left">
                        <span class="hint-icon">👈</span>
                        <span>左手切换上一个</span>
                    </div>
                    <div class="hint-item" id="hint-both">
                        <span class="hint-icon">🤚✋</span>
                        <span>双手确认</span>
                    </div>
                    <div class="hint-item" id="hint-right">
                        <span class="hint-icon">👉</span>
                        <span>右手切换下一个</span>
                    </div>
                </div>

                <div class="gesture-status">
                    <div class="gesture-status-item">
                        <span class="gesture-status-label">当前选项</span>
                        <span id="current-option" class="gesture-status-value active">A</span>
                    </div>
                    <div class="gesture-status-item">
                        <span class="gesture-status-label">左手角度</span>
                        <span id="left-arm-angle" class="gesture-status-value unknown">--°</span>
                    </div>
                    <div class="gesture-status-item">
                        <span class="gesture-status-label">右手角度</span>
                        <span id="right-arm-angle" class="gesture-status-value unknown">--°</span>
                    </div>
                </div>

                <div class="confirm-indicator" id="confirm-indicator">
                    <span class="confirm-indicator-icon">✓</span>
                    <span class="confirm-indicator-text">确认中</span>
                </div>
            </div>

            <div class="camera-preview" id="camera-container">
                <video id="camera-video" autoplay playsinline muted></video>
                <div class="camera-label">姿势追踪</div>
                <canvas id="skeleton-canvas" style="position: absolute; inset: 0; width: 100%; height: 100%;"></canvas>
            </div>

            <div id="result-overlay" class="transition-overlay" style="display: none;">
                <div style="text-align: center; color: var(--color-text);">
                    <h2 id="result-title" style="font-size: 2rem; margin-bottom: 1rem;">全部答对！</h2>
                    <p id="result-message" style="color: var(--color-text-muted);">正在进入试穿环节...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="static/js/hand_tracker.js"></script>
    <script src="static/js/quiz.js"></script>
</body>
</html>
