<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华服雅韵 - 虚拟试穿</title>
    <link rel="stylesheet" href="static/css/traditional.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        .page-container {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 100%);
        }

        .page-header {
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(218,165,32,0.2);
        }

        .page-header h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--china-gold);
            letter-spacing: 0.15em;
        }

        .tryon-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            height: calc(100vh - 100px);
        }

        .camera-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 4/3;
            border-radius: 16px;
            overflow: hidden;
            background: #0a0a0a;
            border: 2px solid rgba(218,165,32,0.3);
        }

        .camera-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scaleX(-1);
            background: #0a0a0a;
        }

        .camera-wrapper canvas { display: none; }

        .camera-status {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 0.5rem 1.5rem;
            border-radius: 25px;
            font-size: 1rem;
            color: var(--color-text-muted);
            border: 1px solid rgba(218,165,32,0.3);
        }

        .gesture-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .gesture-hint.visible { opacity: 1; }

        .gesture-hint-text {
            font-family: var(--font-display);
            font-size: 1.75rem;
            color: var(--china-gold);
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
            letter-spacing: 0.15em;
        }

        .countdown-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .countdown-number {
            font-family: var(--font-display);
            font-size: 10rem;
            color: var(--china-gold);
            text-shadow: 0 0 60px rgba(218,165,32,0.6);
            animation: countdownPulse 1s ease-in-out infinite;
        }

        @keyframes countdownPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .countdown-label {
            font-size: 1.25rem;
            color: var(--color-text-muted);
            margin-top: 1rem;
            letter-spacing: 0.2em;
        }

        .action-buttons {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .upload-btn {
            padding: 0.875rem 2rem;
            background: rgba(218,165,32,0.1);
            border: 2px solid var(--china-gold);
            border-radius: 30px;
            color: var(--china-gold);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .upload-btn:hover {
            background: var(--china-gold);
            color: var(--ink);
        }

        .upload-btn svg {
            width: 20px;
            height: 20px;
        }

        #file-input { display: none; }

        .result-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .clothing-info {
            text-align: center;
            padding: 1rem;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid rgba(218,165,32,0.2);
        }

        .clothing-info h2 {
            font-family: var(--font-display);
            color: var(--china-gold);
            margin-bottom: 0.25rem;
        }

        .clothing-info p {
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }

        .cloth-selector {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cloth-item {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(218,165,32,0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

       .cloth-item:hover {
    border-color: rgba(218,165,32,0.3);
    transform: scale(1.03);
}

        .cloth-item.selected {
    border: 5px solid #C41E3A !important;
    transform: scale(1.2) !important;
    box-shadow: 0 0 40px #C41E3A, 0 0 80px rgba(196,30,58,0.6) !important;
    background: rgba(196,30,58,0.25) !important;
    z-index: 10 !important;
}

        .cloth-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-container {
            position: relative;
            flex: 1;
            min-height: 400px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(218,165,32,0.2);
        }

        .result-placeholder {
            text-align: center;
            color: var(--color-text-muted);
            padding: 2rem;
        }

        .result-placeholder-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .result-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .loading-container {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-ring {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(218,165,32,0.2);
            border-top-color: var(--china-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 1.5rem;
            color: var(--china-gold);
            font-size: 1.25rem;
            letter-spacing: 0.1em;
        }

        .control-button {
            padding: 1rem 2.5rem;
            background: var(--china-gold);
            border: none;
            border-radius: 30px;
            color: var(--ink);
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 25px rgba(218,165,32,0.4);
        }

        .control-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .debug-panel {
            position: fixed;
            top: 80px;
            right: 24px;
            padding: 1rem;
            background: rgba(0,0,0,0.85);
            border: 1px solid rgba(218,165,32,0.3);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #aaa;
            min-width: 180px;
            z-index: 1000;
        }

        .debug-panel .label { color: var(--china-gold); margin-bottom: 0.5rem; font-size: 0.875rem; }
        .debug-row { display: flex; justify-content: space-between; margin: 0.3rem 0; }
        .debug-row .key { color: var(--color-text-muted); }
        .debug-row .value { color: #2ecc71; }

        /* 手势操作指南 */
        .gesture-guide {
            display: flex;
            gap: 2rem;
            justify-content: center;
            padding: 1rem 1.5rem;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 1px solid rgba(218,165,32,0.2);
        }
        .gesture-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .gesture-icon {
            font-size: 1.5rem;
            filter: drop-shadow(0 0 8px rgba(218,165,32,0.5));
        }
        .gesture-desc {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            white-space: nowrap;
        }

        /* 增强的加载动画 - 中国传统风格 */
        .loading-container {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 全景背景 */
        #loading-bg-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            border-radius: 16px;
        }

        .loading-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loading-animation {
            position: relative;
            width: 160px;
            height: 160px;
        }

        /* 外圈 - 金色主环 */
        .loading-outer-ring {
            position: absolute;
            inset: 0;
            border: 3px solid transparent;
            border-top-color: #D4A84B;
            border-right-color: #D4A84B;
            border-radius: 50%;
            animation: spinOuter 3s linear infinite;
        }

        /* 次外圈 - 装饰环 */
        .loading-mid-ring {
            position: absolute;
            inset: 10px;
            border: 2px dashed rgba(212,168,75,0.4);
            border-radius: 50%;
            animation: spinMid 4s linear infinite reverse;
        }

        /* 云纹装饰 - 上 */
        .loading-cloud {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: spinCloud 8s linear infinite;
        }

        .loading-cloud::before,
        .loading-cloud::after {
            content: '☁';
            position: absolute;
            font-size: 1.2rem;
            color: rgba(212,168,75,0.6);
        }

        .loading-cloud::before {
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
        }

        .loading-cloud::after {
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 内圈 - 旋转光效 */
        .loading-inner {
            position: absolute;
            inset: 25px;
            border: 2px solid rgba(212,168,75,0.2);
            border-top-color: rgba(212,168,75,0.8);
            border-radius: 50%;
            animation: spinInner 1.5s linear infinite;
        }

        /* 中心光点 */
        .loading-core {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #FFD700 0%, #D4A84B 50%, transparent 70%);
            border-radius: 50%;
            animation: coreGlow 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px #FFD700, 0 0 40px rgba(255,215,0,0.5);
        }

        /* 华服文字 */
        .loading-emblem {
            position: absolute;
            inset: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: #D4A84B;
            text-shadow: 0 0 10px rgba(212,168,75,0.8);
            animation: emblemFade 2s ease-in-out infinite alternate;
        }

        @keyframes spinOuter { to { transform: rotate(360deg); } }

        @keyframes spinMid {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinCloud {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinInner { to { transform: rotate(360deg); } }

        @keyframes coreGlow {
            0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.9); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes emblemFade {
            0% { opacity: 0.5; text-shadow: 0 0 10px rgba(212,168,75,0.5); }
            100% { opacity: 1; text-shadow: 0 0 20px rgba(212,168,75,1), 0 0 40px rgba(212,168,75,0.5); }
        }

        /* 装饰光点 */
        .loading-particles {
            position: absolute;
            inset: -20px;
            pointer-events: none;
        }

        .loading-particles span {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #D4A84B;
            border-radius: 50%;
            box-shadow: 0 0 6px #FFD700;
        }

        .loading-particles span:nth-child(1) { top: 0; left: 50%; animation: particleFloat 3s ease-in-out infinite; }
        .loading-particles span:nth-child(2) { top: 50%; right: 0; animation: particleFloat 3s ease-in-out infinite 0.5s; }
        .loading-particles span:nth-child(3) { bottom: 0; left: 50%; animation: particleFloat 3s ease-in-out infinite 1s; }
        .loading-particles span:nth-child(4) { top: 50%; left: 0; animation: particleFloat 3s ease-in-out infinite 1.5s; }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-5px) scale(1.3); opacity: 1; }
        }

        .loading-text {
            margin-top: 2rem;
            color: var(--china-gold);
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            text-align: center;
        }

        .loading-timer {
            margin-top: 0.75rem;
            font-size: 0.875rem;
            color: rgba(218,165,32,0.7);
            font-family: var(--font-display);
        }

        .loading-step {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="tryon-page" class="page-container">
        <div class="page-header">
            <h1>虚拟试穿</h1>
        </div>

        <div class="tryon-layout">
            <div class="camera-section">
                <div class="camera-wrapper" id="user-camera">
                    <video id="camera-video" autoplay playsinline muted></video>
                    <canvas id="capture-canvas" style="display: none;"></canvas>
                    <div id="camera-status" class="camera-status">举起手臂开始拍照</div>
                    <div id="gesture-hint" class="gesture-hint visible">
                        <div class="gesture-hint-text">举起手臂</div>
                    </div>
                    <div id="countdown-overlay" class="countdown-overlay">
                        <div id="countdown-number" class="countdown-number">5</div>
                        <div class="countdown-label">准备拍照</div>
                    </div>
                </div>

                <div class="gesture-guide">
                    <div class="gesture-item">
                        <div class="gesture-icon">✋</div>
                        <div class="gesture-desc">左手 → 上一套</div>
                    </div>
                    <div class="gesture-item">
                        <div class="gesture-icon">🤚</div>
                        <div class="gesture-desc">右手 → 下一套</div>
                    </div>
                    <div class="gesture-item">
                        <div class="gesture-icon">🤲</div>
                        <div class="gesture-desc">双手 → 拍照</div>
                    </div>
                </div>

                <div class="action-buttons">
                    <label class="upload-btn" for="file-input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        本地上传
                    </label>
                    <input type="file" id="file-input" accept="image/*">
                </div>
            </div>

            <div class="result-section">
                <div class="clothing-info">
                    <h2 id="clothing-name">加载中...</h2>
                    <p id="clothing-dynasty"></p>
                </div>

                <div class="cloth-selector" id="cloth-selector">
                </div>

                <div class="result-container" id="tryon-result">
                    <div id="loading-indicator" class="loading-container">
                        <canvas id="loading-bg-canvas"></canvas>
                        <div class="loading-content">
                            <div class="loading-animation">
                            <div class="loading-outer-ring"></div>
                            <div class="loading-mid-ring"></div>
                            <div class="loading-cloud"></div>
                            <div class="loading-inner"></div>
                            <div class="loading-particles">
                                <span></span><span></span><span></span><span></span>
                            </div>
                            <div class="loading-core"></div>
                            <div class="loading-emblem">華</div>
                        </div>
                        <div id="loading-text" class="loading-text">正在生成...</div>
                        <div id="loading-timer" class="loading-timer">预计剩余 45 秒</div>
                        <div id="loading-step" class="loading-step">妙手裁云 · 分析穿搭细节</div>
                        </div>
                    </div>
                    <div id="result-placeholder" class="result-placeholder">
                        <div class="result-placeholder-icon">👘</div>
                        <div>举起手臂自动拍照<br>或选择本地图片上传</div>
                    </div>
                    <img id="result-image" class="result-image" />
                </div>

                <div class="action-buttons" style="justify-content: center;">
                    <button id="regenerate-btn" class="control-button" disabled>重新生成</button>
                </div>
            </div>
        </div>

        <div class="debug-panel" id="debug-panel">
            <div class="label">手势检测</div>
            <div class="debug-row"><span class="key">倒计时:</span><span id="dbg-countdown" class="value">--</span></div>
            <div class="debug-row"><span class="key">状态:</span><span id="dbg-state" class="value">待机</span></div>
        </div>
    </div>

    <script src="static/js/hand_tracker.js"></script>
    <script src="static/js/tryon.js"></script>
</body>
</html>
